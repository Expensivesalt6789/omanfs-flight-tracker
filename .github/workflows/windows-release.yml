name: Build OmanFS Windows Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        shell: powershell
        run: npm install
      - name: Verify branding assets
        shell: powershell
        run: |
          if (!(Test-Path 'assets/icon.ico')) { throw 'assets/icon.ico is required before the Windows release can be built.' }
      - name: Build EXE and NSIS installer
        shell: powershell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: OmanFS-Flight-Tracker-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30

name: Build OmanFS Windows Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Create Windows icon from OmanFS branding
        shell: powershell
        run: magick assets/logo.svg -background none -define icon:auto-resize=256,128,64,48,32,16 assets/icon.ico
      - name: Build application EXE and graphical NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win -- --publish never
      - name: Upload finished Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: OmanFS-Flight-Tracker-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
